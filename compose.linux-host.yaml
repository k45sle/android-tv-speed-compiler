services:
  android-tv-speed-compiler:
    build: .
    image: android-tv-speed-compiler:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15m
    network_mode: host
    environment:
      TVCOMPILER_HOST: 127.0.0.1
      TVCOMPILER_PORT: 8000
      TVCOMPILER_LOCAL_SETUP: ${TVCOMPILER_LOCAL_SETUP:-1}
      TVCOMPILER_BOOTSTRAP_TOKEN: ${TVCOMPILER_BOOTSTRAP_TOKEN:-}
      TVCOMPILER_COOKIE_SECURE: ${TVCOMPILER_COOKIE_SECURE:-0}
      TVCOMPILER_PUBLIC_ORIGIN: ${TVCOMPILER_PUBLIC_ORIGIN:-}
    volumes:
      - tvcompiler-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  tvcompiler-data:
