name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: make check
      - run: make docker-check

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: android-tv-speed-compiler:ci
          outputs: type=docker,dest=/tmp/image.tar
      - run: docker load --input /tmp/image.tar
      - run: docker run -d --name tvcompiler-image-smoke -p 127.0.0.1:18765:8000 android-tv-speed-compiler:ci
      - name: Check offline service and bundled tools
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/health | grep -q '"status":"ok"'
          docker exec tvcompiler-image-smoke /bin/sh -c 'adb help 2>&1 | grep -E "(^|[[:space:]])(pair|mdns)([[:space:]]|$)"'
          docker exec tvcompiler-image-smoke python -c 'from zoneinfo import ZoneInfo; ZoneInfo("America/Chicago")'
      - if: always()
        run: docker rm -f tvcompiler-image-smoke
