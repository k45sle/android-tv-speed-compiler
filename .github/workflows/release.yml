name: Release

# Push a tag like v2.0.0 (three numbers, optional -suffix) to build a signed APK and attach it to a GitHub Release.
# Needs repository secrets RELEASE_KEYSTORE_B64 (base64 of the .jks), RELEASE_STORE_PASSWORD and RELEASE_KEY_ALIAS.
# Run it by hand with a tag to rebuild that tag's release with this workflow, e.g. after a failed run, without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, like v1.0.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "Tag must look like v1.2.3 or v1.2.3-rc1 with each number under 100, got $TAG"; exit 1; }
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Fail rather than publish an unsigned APK.
          test -n "$KEYSTORE_B64" || { echo "RELEASE_KEYSTORE_B64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew lint testDebugUnitTest assembleRelease "-PappVersion=${TAG#v}"
      - name: Verify signature and write checksums
        run: |
          apk="speed-compile-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Stable name so releases/latest/download/speed-compile.apk always works.
          cp "$apk" speed-compile.apk
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify "$apk"
          # Keep only the digest line: the full --print-certs output names the certificate's owner and the logs are public.
          certs="$("$apksigner" verify --print-certs "$apk" | grep -v 'DN:')"
          # Newer apksigner versions label the signer differently ("Signer (minSdkVersion=...)"), so match only the digest.
          cert="$(grep -m1 -ioE 'certificate SHA-256 digest: [0-9a-f]{64}' <<<"$certs" | awk '{print tolower($4)}')"
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "Could not read the signing certificate digest from:"; echo "$certs"; exit 1; }
          sha256sum "$apk" speed-compile.apk > SHA256SUMS
          {
            echo "Signing certificate SHA-256: \`$cert\`"
            echo
            echo "To check a download, run \`sha256sum -c SHA256SUMS\` and \`gh attestation verify speed-compile.apk -R $GITHUB_REPOSITORY\`."
            echo
          } > "$RUNNER_TEMP/notes.md"
          echo "APK=$apk" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            speed-compile-*.apk
            speed-compile.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A suffix (v2.0.0-rc1) marks a pre-release, so test tags never become "Latest". With --generate-notes, --notes-file text comes first.
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" "$APK" speed-compile.apk SHA256SUMS --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}"
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
