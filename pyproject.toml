[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-tv-speed-compiler"
version = "0.1.0"
description = "Private, persistent Android TV speed-compilation service"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "jinja2==3.1.6"]

[project.scripts]
tvcompiler = "tvcompiler.web:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.10",
    "httpx2==2.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvcompiler = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
